stages:
  - test

default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TEST_ENV: ci
  BASE_URL: "https://the-internet.herokuapp.com"
  BROWSER: chrome
  HEADLESS: "true"
  TEST_TIMEOUT: "15"
  SIMULACAO_CREDITO_URL: "http://127.0.0.1:8765/mock/simulacao_credito.html"

.robot-base:
  stage: test
  before_script:
    - pip install --cache-dir .cache/pip -r requirements.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - results/
    reports:
      junit: results/junit.xml

test:smoke:
  extends: .robot-base
  script:
    - mkdir -p results
    - >
      robot
      --pythonpath libraries
      --pythonpath variables
      --outputdir results
      --xunit results/junit.xml
      --include smoke
      --exclude web
      tests/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Chrome/Chromium no job (sem Grid): mock HTTP em localhost acessível ao browser.
test:web:
  extends: .robot-base
  image: python:3.12
  before_script:
    - apt-get update -qq && apt-get install -y -qq chromium chromium-driver curl
    - pip install --cache-dir .cache/pip -r requirements.txt
    - python -m http.server 8765 --directory data --bind 127.0.0.1 &
    - |
      for i in $(seq 1 20); do
        curl -sf "http://127.0.0.1:8765/mock/simulacao_credito.html" >/dev/null && break
        sleep 0.5
      done
  variables:
    BROWSER: chrome
    CHROME_BINARY: /usr/bin/chromium
  script:
    - mkdir -p results
    - >
      robot
      --pythonpath libraries
      --pythonpath variables
      --outputdir results
      --xunit results/junit.xml
      --include financiamento
      tests/financiamento/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

test:web:manual:
  extends: test:web
  rules:
    - when: manual
      allow_failure: true
