stages:
  - test

default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  TEST_ENV: ci
  BROWSER: chrome
  HEADLESS: "true"
  TEST_TIMEOUT: "15"
  SIMULACAO_CREDITO_URL: "http://127.0.0.1:8765/simulacao_credito.html"

.robot-base:
  stage: test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - results/
    reports:
      junit: results/junit.xml

test:e2e:
  extends: .robot-base
  image: python:3.12
  before_script:
    - apt-get update -qq && apt-get install -y -qq chromium chromium-driver curl
    - pip install --cache-dir .cache/pip -r requirements.txt
    - python -m http.server 8765 --directory app --bind 127.0.0.1 &
    - |
      for i in $(seq 1 20); do
        curl -sf "http://127.0.0.1:8765/simulacao_credito.html" >/dev/null && break
        sleep 0.5
      done
  variables:
    BROWSER: chrome
    CHROME_BINARY: /usr/bin/chromium
  script:
    - mkdir -p results
    - >
      robot
      --pythonpath e2e/variables
      --outputdir results
      --xunit junit.xml
      --include financiamento
      e2e/tests/financiamento/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

test:e2e:manual:
  extends: test:e2e
  rules:
    - when: manual
      allow_failure: true
